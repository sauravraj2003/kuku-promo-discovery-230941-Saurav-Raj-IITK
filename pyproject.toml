[project]
name = "kuku-discovery"
version = "0.1.0"
description = "Source-grounded screenplay candidate discovery"
requires-python = ">=3.11"

dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[project.scripts]
kuku = "kuku.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "--basetemp=.runtime/pytest_tmp"

