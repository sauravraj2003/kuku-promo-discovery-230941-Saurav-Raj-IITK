services:
  - type: web
    name: kuku-promo-discovery
    runtime: python
    buildCommand: pip install .
    startCommand: uvicorn kuku.api:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: KUKU_PROVIDER
        value: rules
      - key: KUKU_AUTO_SEED
        value: "1"
